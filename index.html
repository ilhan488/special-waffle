<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lotso Dino Run 💗</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0; min-height:100vh; overflow:hidden;
  font-family:Arial,sans-serif;
  background:linear-gradient(#ffd6e7 0%,#ffeaf3 58%,#f7b4ce 100%);
  color:#7a3152; touch-action:none;
}
#game{
  position:relative;width:100%;height:100vh;overflow:hidden;
}
.cloud{position:absolute;background:#fff5fa;border-radius:50px;opacity:.8}
.cloud:before,.cloud:after{content:"";position:absolute;background:#fff5fa;border-radius:50%}
.cloud:before{width:55px;height:55px;left:25px;bottom:0}
.cloud:after{width:75px;height:75px;right:20px;bottom:0}
.c1{width:150px;height:35px;top:13%;left:5%}
.c2{width:180px;height:40px;top:25%;right:8%}
.c3{width:110px;height:28px;top:7%;right:38%}

#top{
  position:absolute;z-index:20;top:15px;left:50%;transform:translateX(-50%);
  width:min(92%,560px);display:flex;justify-content:space-between;align-items:center;
  background:rgba(255,255,255,.72);border:2px solid #f49cbe;border-radius:22px;
  padding:9px 15px;box-shadow:0 5px 18px #bd587d33;backdrop-filter:blur(5px);
}
.title{font-weight:900;font-size:17px} .score{font-weight:900}
#world{position:absolute;left:0;right:0;bottom:105px;height:52%;}
#ground{
  position:absolute;left:0;right:0;bottom:0;height:12px;
  background:#b95d7d;box-shadow:0 -4px 0 #e58eaa;
}
.flower{position:absolute;bottom:13px;font-size:25px}
.f1{left:8%}.f2{left:35%}.f3{left:65%}.f4{left:88%}

.dino{
  position:absolute;bottom:13px;left:11%;width:95px;height:125px;z-index:8;
  transition:none;
}
.dino.small{left:1%;transform:scale(.72);transform-origin:bottom left}
.dino .body{
  position:absolute;bottom:0;left:17px;width:72px;height:72px;
  background:#f28bad;border:4px solid #a94368;border-radius:38px 42px 25px 25px;
  box-shadow:inset -7px -8px 0 #e8799b;
}
.dino .tail{
  position:absolute;bottom:19px;left:0;width:38px;height:28px;
  background:#f28bad;border:4px solid #a94368;border-right:0;
  border-radius:28px 0 0 28px;transform:rotate(-15deg);
}
.dino .leg{
  position:absolute;bottom:-1px;width:18px;height:30px;background:#f28bad;
  border:4px solid #a94368;border-top:0;border-radius:0 0 12px 12px;
}
.leg.l{left:30px}.leg.r{left:64px}
.head{
  position:absolute;top:0;left:25px;width:70px;height:70px;
  border-radius:50%;overflow:hidden;border:4px solid #a94368;
  background:#ffc1d6;box-shadow:0 4px 0 #9d3e61;
}
.head img{width:100%;height:100%;object-fit:cover}
.girl .head img{object-position:51% 39%}
.boy .head img{object-position:50% 35%}
.ear{position:absolute;top:5px;width:19px;height:22px;background:#f28bad;border:4px solid #a94368;border-radius:50%}
.ear.l{left:18px}.ear.r{left:78px}
.name{
  position:absolute;top:-23px;left:50%;transform:translateX(-50%);
  white-space:nowrap;font-size:11px;font-weight:900;background:#fff;
  border:2px solid #f49cbe;border-radius:10px;padding:2px 7px;
}
.obstacle{
  position:absolute;bottom:13px;right:-90px;width:60px;height:78px;z-index:7;
}
.cactus{
  position:absolute;bottom:0;left:15px;width:31px;height:67px;
  background:#76a85d;border:4px solid #527a43;border-radius:18px;
}
.cactus:before,.cactus:after{content:"";position:absolute;background:#76a85d;border:4px solid #527a43;width:22px;height:38px;border-radius:15px}
.cactus:before{left:-21px;top:22px} .cactus:after{right:-20px;top:10px}
.obstacle.flowerpot .cactus{background:#e79b9b;border-color:#a95d68;border-radius:4px 4px 13px 13px;height:40px;bottom:0}
.obstacle.flowerpot .cactus:before,.obstacle.flowerpot .cactus:after{display:none}

.jump{animation:jump .7s cubic-bezier(.2,.7,.3,1)}
@keyframes jump{0%{bottom:13px}45%{bottom:230px}100%{bottom:13px}}

#startScreen,#gameOver{
 position:absolute;z-index:30;inset:0;display:flex;align-items:center;justify-content:center;
 background:rgba(255,220,234,.78);backdrop-filter:blur(5px);
}
.card{
 width:min(90%,430px);text-align:center;background:#fff8fb;border:3px solid #ef91b4;
 border-radius:28px;padding:27px 22px;box-shadow:0 12px 35px #9f3f6138;
}
.card h1{margin:0 0 8px;font-size:32px;color:#a83e68}
.card p{line-height:1.5;margin:9px 0 18px}
button{
 border:0;background:#d95b88;color:white;font-weight:900;font-size:17px;
 padding:13px 28px;border-radius:30px;box-shadow:0 5px 0 #a83e68;cursor:pointer;
}
button:active{transform:translateY(3px);box-shadow:0 2px 0 #a83e68}
#gameOver{display:none}
.hearts{font-size:30px;letter-spacing:5px}
.hint{font-size:13px;opacity:.75;margin-top:12px}
</style>
</head>

      <div class="tail"></div><div class="body"></div><div class="leg l"></div><div class="leg r"></div>
    </div>

    <div id="ground"></div>
  </div>

  <div id="startScreen">
    <div class="card">
      <div class="hearts">🩷 🍓 🩷</div>
      <h1>Lotso Dino Run</h1>
      <p>Two dinos, one mission! 🦖🦖<br>
      Lompat sama-sama dan elakkan halangan.</p>
      <button onclick="startGame()">START GAME</button>
      <div class="hint">Tap screen / SPACE untuk lompat</div>
    </div>
  </div>

  <div id="gameOver">
    <div class="card">
      <div class="hearts">💗🌸💗</div>
      <h1>Game Over!</h1>
      <p>Score: <b><span id="finalScore">0</span></b></p>
      <button onclick="startGame()">PLAY AGAIN</button>
    </div>
  </div>
</div>

<script>
const girl=document.getElementById('girl'), boy=document.getElementById('boy');
const world=document.getElementById('world'), scoreEl=document.getElementById('score');
const gameOver=document.getElementById('gameOver'), startScreen=document.getElementById('startScreen');
let running=false, score=0, speed=6, last=0, spawnTimer=0, obstacle=null;

function jump(){
  if(!running) return;
  if(!girl.classList.contains('jump')){
    girl.classList.add('jump'); boy.classList.add('jump');
    setTimeout(()=>{girl.classList.remove('jump');boy.classList.remove('jump')},700);
  }
}

function makeObstacle(){
  if(obstacle) obstacle.remove();
  obstacle=document.createElement('div');
  obstacle.className='obstacle';
  obstacle.innerHTML='<div class="cactus"></div>';
  world.appendChild(obstacle);
  obstacle.dataset.x=world.clientWidth+80;
}

function collision(){
  if(!obstacle) return false;
  const a=girl.getBoundingClientRect(), b=boy.getBoundingClientRect(), o=obstacle.getBoundingClientRect();
  const hit=(r)=>r.right-13>o.left && r.left+13<o.right && r.bottom-12>o.top+10 && r.top+12<o.bottom;
  return hit(a)||hit(b);
}


function startMusic(){
  const music=document.getElementById('bgMusic');
  music.volume=0.55;
  music.currentTime=0;
  music.play().catch(()=>{});
}

function loop(t){
  if(!running) return;
  const dt=Math.min(40,t-last||16); last=t;
  spawnTimer+=dt;
  if(!obstacle && spawnTimer>650){makeObstacle();spawnTimer=0}
  if(obstacle){
    let x=parseFloat(obstacle.dataset.x)-speed*(dt/16.67);
    obstacle.dataset.x=x; obstacle.style.left=x+'px'; obstacle.style.right='auto';
    if(x<-100){obstacle.remove();obstacle=null;score++;scoreEl.textContent=score;speed=Math.min(13,6+score*.035)}
  }
  if(collision()) endGame();
  requestAnimationFrame(loop);
}

function startGame(){
  running=true;
  startMusic();
  score=0;speed=6;spawnTimer=0;last=0;
  scoreEl.textContent='0'; startScreen.style.display='none';gameOver.style.display='none';
  if(obstacle){obstacle.remove();obstacle=null}
  requestAnimationFrame(loop);
}

function endGame(){
  running=false;
  document.getElementById('bgMusic').pause();
  document.getElementById('finalScore').textContent=score;
  gameOver.style.display='flex';
}

document.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault(); if(!running) startGame(); else jump();}
});
document.addEventListener('touchstart',e=>{
  if(e.target.tagName==='BUTTON') return;
  if(!running) startGame(); else jump();
},{passive:false});
document.addEventListener('mousedown',e=>{
  if(e.target.tagName==='BUTTON') return;
  if(!running) return; jump();
});
</script>
